<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bethel Mission School – Voice Assistant</title>
<style>
:root{color-scheme:dark;--bg1:#13307a;--bg2:#050b22;--ink:#f3f7ff;--mute:#a9bbe6;--acc:#5ee0ff;--gold:#fbbf24;--card:#12214d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(circle at 50% 25%,var(--bg1),var(--bg2) 75%);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
.stars{position:fixed;inset:0;background-image:radial-gradient(2px 2px at 20% 30%,#fff8,transparent),radial-gradient(2px 2px at 70% 20%,#fff8,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#fff8,transparent),radial-gradient(2px 2px at 85% 65%,#fff8,transparent),radial-gradient(1.5px 1.5px at 10% 70%,#fff8,transparent);animation:tw 3s infinite alternate}
@keyframes tw{to{opacity:.35}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;text-align:center;transition:opacity .9s}
#splash{z-index:2}#splash.hide{opacity:0;pointer-events:none}
#logoCard{width:min(56vw,250px);aspect-ratio:1;background:#fff;border-radius:30px;padding:8px;box-shadow:0 0 0 4px var(--gold),0 0 60px rgba(251,191,36,.55);animation:pop 1.6s cubic-bezier(.2,1.3,.4,1) both}
#logoCard img{width:100%;height:100%;object-fit:contain;display:block}
@keyframes pop{from{transform:scale(.2) rotate(-60deg);opacity:0}to{transform:none;opacity:1}}
h1{font-size:clamp(20px,5vw,32px);letter-spacing:.04em;color:var(--gold);line-height:1.25;animation:fade 1.4s .9s both}
.sub{color:var(--mute);letter-spacing:.2em;font-size:14px;animation:fade 1.4s 1.3s both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:13px 30px;background:linear-gradient(135deg,#5ee0ff,#3b82f6);color:#04162b;font-weight:700;box-shadow:0 6px 20px rgba(59,130,246,.45);transition:transform .15s}
button:active{transform:scale(.94)}
button.ghost{background:#12214d;color:var(--ink);border:1px solid #33498c;box-shadow:none;padding:10px 16px;font-weight:500;font-size:14px}
#startBtn{animation:fade 1.2s 2s both,bob 1.6s 3.2s infinite}
@keyframes bob{50%{transform:scale(1.07)}}
#bot{opacity:0;pointer-events:none;gap:10px}
#bot.show{opacity:1;pointer-events:auto}
#miniName{font-size:13px;color:var(--gold);letter-spacing:.08em;position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px)}
#stage{position:relative;width:min(80vw,40vh,360px);aspect-ratio:220/190}
#face{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 12px 40px rgba(94,224,255,.3));animation:float 3.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-9px)}}
#headG{transform-origin:200px 300px;transition:transform .4s}
.talking #headG{animation:nod .7s ease-in-out infinite alternate}
@keyframes nod{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg) translateY(-2px)}}
.eyes{animation:look 7s infinite}
@keyframes look{0%,40%{transform:translate(0,0)}45%,60%{transform:translate(8px,2px)}65%,85%{transform:translate(-8px,-2px)}90%,100%{transform:translate(0,0)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.05)}}
.brow{transition:transform .25s}
.talking .brow{transform:translateY(-6px)}
#ball{transform-origin:200px 38px;animation:sway 2.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.talking #ball{filter:drop-shadow(0 0 8px #ff7aa8)}
#armR{transform-origin:304px 350px}
.wave #armR{animation:wave .45s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-125deg)}to{transform:rotate(-165deg)}}
#armL{transform-origin:96px 350px;animation:idle 3s ease-in-out infinite alternate}
@keyframes idle{to{transform:rotate(5deg)}}
.ring{position:absolute;left:50%;top:50%;width:70%;aspect-ratio:1;border-radius:50%;border:3px solid #5ee0ff;transform:translate(-50%,-55%);opacity:0;pointer-events:none}
.talking .ring{animation:ripple 1.6s infinite}.talking .ring.r2{animation-delay:.8s}
@keyframes ripple{from{transform:translate(-50%,-55%) scale(.8);opacity:.6}to{transform:translate(-50%,-55%) scale(1.5);opacity:0}}
.fx{position:fixed;bottom:30%;font-size:26px;pointer-events:none;animation:up 3.2s ease-out forwards;z-index:5}
@keyframes up{from{transform:translateY(0) scale(.5);opacity:1}to{transform:translateY(-260px) scale(1.3) rotate(25deg);opacity:0}}
#status{font-size:14px;color:var(--acc);display:flex;align-items:center;gap:8px;min-height:22px}
.mic{width:10px;height:10px;border-radius:50%;background:#667}
.mic.on{background:#22c55e;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}100%{box-shadow:0 0 0 9px rgba(34,197,94,0)}}
#heard{font-size:13px;color:var(--mute);min-height:18px;max-width:92vw}
#caption{font-size:16px;max-width:600px;min-height:70px;line-height:1.5;padding:0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#eyesWrap{filter:drop-shadow(0 0 9px #34c2f0)}.talking #eyesWrap{filter:drop-shadow(0 0 18px #6be3ff)}
#headG{transform-origin:200px 170px}
</style>
</head>

    <button class="ghost" id="eH">Happy</button><button class="ghost" id="eS">Sad</button><button class="ghost" id="eA">Angry</button><button class="ghost" id="eN">Normal</button>
  </div>
</div>

<script>
var SCHOOL = "Bethel Mission Higher Secondary School, Anuppur";
var BOT = "Bethel Buddy";

var INTRO = "Hi there! Hello, everyone! I’m " + BOT + ", the friendly voice assistant of " + SCHOOL + ". I’m so happy to meet you all today! You can say hello to me, or ask me to welcome our guests, and I’ll do my very best to make this day special.";
var WELCOME = "Good day, everyone! A very warm welcome to our respected guests, our honourable teachers, our lovely parents, and my dear friends, the students! It’s truly an honour to have you here at " + SCHOOL + ". Thank you so much for being with us today. Together, let’s make it a wonderful and memorable occasion. Lighted to lighten!";
var THANKS = "Aww, you’re most welcome! It’s my pleasure.";
var BYE = "Goodbye, everyone! Thank you for visiting " + SCHOOL + ". Have a lovely day!";
var UNK = "Hmm, I didn’t quite catch that. You can say hello, welcome, happy, sad, angry, or normal.";

var $ = function(i){return document.getElementById(i)};
var bot=$("bot"), mouth=$("mouth"), tongue=$("tongue"), face=$("face");
var speaking=false, pulse=0, openCur=0, queueLeft=0, rec=null, recRunning=false, micWanted=false;

/* ---------- expressions + mouth ---------- */
var EXPS=["neutral","happy","love","wink","surprised","sad","confused","angry"];
var SM={neutral:9,happy:18,love:18,wink:14,surprised:0,sad:-9,confused:1,angry:-7};
var smileT=9,smileC=9,moods=["neutral"],expTimer=null;
function setExp(n){EXPS.forEach(function(e){var g=$("x_"+e);if(g)g.style.display=e===n?"block":"none"});smileT=SM[n]}
function nextExp(){}

function drawMouth(o,w,s){mouth.setAttribute("d","M"+(-w)+" 0 Q0 "+s+" "+w+" 0 Q0 "+(s+o*32)+" "+(-w)+" 0Z")}
(function loop(t){
  var target=0;
  if(speaking){var wob=0.3+0.35*Math.abs(Math.sin(t/95))+0.15*Math.abs(Math.sin(t/41));target=Math.min(1,wob+pulse*0.45);pulse*=0.86}
  openCur+=(target-openCur)*0.35;smileC+=(smileT-smileC)*0.2;
  drawMouth(openCur,19+openCur*7,smileC);
  requestAnimationFrame(loop);
})(0);

/* ---------- voice (more natural) ---------- */
var voices=[];
function loadV(){voices=speechSynthesis.getVoices()}
if("speechSynthesis" in window){loadV();speechSynthesis.onvoiceschanged=loadV}
function bestVoice(){
  var pri=[/natural.*(neerja|aria|jenny|sonia|libby|ana)/i,/neerja|aria|jenny|sonia|libby/i,/google uk english female/i,/google.*(india|en-in)/i,/samantha|karen|moira|veena|tessa/i,/female|zira/i,/^en/i];
  for(var i=0;i<pri.length;i++){
    var v=voices.find(function(x){return pri[i].test(x.name)||(i==pri.length-1&&pri[i].test(x.lang))});
    if(v)return v;
  }
  return voices[0];
}
function sentences(t){return t.match(/[^.!?]+[.!?]+/g)||[t]}
function say(text){
  $("caption").textContent=text;
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel(); stopRec();
  var parts=sentences(text), v=bestVoice(); queueLeft=parts.length;
  parts.forEach(function(p,i){
    var u=new SpeechSynthesisUtterance(p.trim());
    if(v){u.voice=v;u.lang=v.lang}else u.lang="en-IN";
    var ex=/!/.test(p), q=/\?/.test(p);
    u.rate=0.9+Math.random()*0.07;
    u.pitch=(ex?1.2:q?1.15:1.08)+Math.random()*0.08;
    u.volume=1;
    u.onstart=function(){if(i===0)begin();nextExp()};
    u.onboundary=function(){pulse=1};
    var fin=function(){queueLeft--;if(queueLeft<=0)finish()};
    u.onend=fin;u.onerror=fin;
    speechSynthesis.speak(u);
  });
}
function begin(){clearInterval(expTimer);expTimer=setInterval(nextExp,1600);speaking=true;bot.classList.add("talking");$("statusTxt").textContent="Speaking…"}
function finish(){clearInterval(expTimer);speaking=false;bot.classList.remove("talking","wave");$("statusTxt").textContent=micWanted?"Listening… say “Hello”":"Say “Hello”";if(micWanted)setTimeout(startRec,400)}

/* ---------- little celebrations ---------- */
function burst(list,n){
  for(var i=0;i<n;i++)setTimeout(function(){
    var s=document.createElement("div");s.className="fx";s.textContent=list[Math.floor(Math.random()*list.length)];
    s.style.left=(10+Math.random()*80)+"vw";document.body.appendChild(s);setTimeout(function(){s.remove()},3300);
  },i*140);
}

/* ---------- commands ---------- */
var MOODSAY={happy:"Yay! I’m feeling very happy today!",sad:"Oh no. I’m feeling a little sad.",angry:"Hmph! I’m feeling quite angry now.",surprised:"Wow! What a surprise!",neutral:"Okay, I’m back to normal."};
function mood(n){setExp(n);say(MOODSAY[n])}
function handle(text){
  var t=text.toLowerCase();
  $("heard").textContent="You said: “"+text+"”";
  if(/angry|gussa/.test(t))mood("angry");
  else if(/\bsad\b|unhappy/.test(t))mood("sad");
  else if(/happy|smile/.test(t))mood("happy");
  else if(/surprise/.test(t))mood("surprised");
  else if(/normal|neutral/.test(t))mood("neutral");
  else if(/welcome|guest/.test(t))say(WELCOME);
  else if(/\b(hello|hi|hey|namaste|good (morning|afternoon|evening))\b|introduce|who are you|your name/.test(t))say(INTRO);
  else if(/thank/.test(t))say(THANKS);
  else if(/bye/.test(t))say(BYE);
  else say(UNK);
}

/* ---------- mic ---------- */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function startRec(){
  if(!SR||recRunning||speaking)return;
  if(!rec){
    rec=new SR();rec.lang="en-IN";rec.continuous=false;rec.interimResults=false;
    rec.onstart=function(){recRunning=true;$("micDot").classList.add("on");if(!speaking)$("statusTxt").textContent="Listening… say “Hello”"};
    rec.onresult=function(e){var s=e.results[e.results.length-1][0].transcript.trim();if(s)handle(s)};
    rec.onerror=function(e){
      if(e.error==="not-allowed"||e.error==="service-not-allowed"){micWanted=false;$("statusTxt").textContent="Mic blocked. Allow microphone (lock icon in address bar) or open this file directly in Chrome"}
      else if(e.error==="network"){micWanted=false;$("statusTxt").textContent="Voice needs internet. Check connection"}
      else if(e.error==="audio-capture"){micWanted=false;$("statusTxt").textContent="No microphone found"}
    };
    rec.onend=function(){recRunning=false;$("micDot").classList.remove("on");if(micWanted&&!speaking)setTimeout(startRec,300)};
  }
  try{rec.start()}catch(e){}
}
function stopRec(){if(rec&&recRunning){try{rec.abort()}catch(e){}}}

$("eH").onclick=function(){handle("happy")};$("eS").onclick=function(){handle("sad")};$("eA").onclick=function(){handle("angry")};$("eN").onclick=function(){handle("normal")};
$("bHello").onclick=function(){handle("hello")};
$("bWelcome").onclick=function(){handle("welcome")};
$("bMic").onclick=function(){micWanted=!micWanted;if(micWanted)startRec();else{stopRec();$("statusTxt").textContent="Mic off – use the buttons"}};
$("startBtn").onclick=function(){
  $("splash").classList.add("hide");bot.classList.add("show");
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(""))}catch(e){}
  if(SR){micWanted=true;startRec()}else $("statusTxt").textContent="Voice input not supported – use the buttons";
};
</script>
</body>
</html>
